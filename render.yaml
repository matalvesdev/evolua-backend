services:
  # Backend API (Fastify/Node.js)
  - type: web
    name: evolua-api
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    rootDir: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: evolua-ai
          envVarKey: INTERNAL_SERVICE_TOKEN
      - key: CORS_ORIGINS
        value: https://app.useevolua.com.br
      - key: FRONTEND_URL
        value: https://app.useevolua.com.br
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: evolua-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: naoresponder@useevolua.com.br
      - key: PIX_KEY
        sync: false
      - key: PIX_MERCHANT_NAME
        value: EVOLUA CLINICA
      - key: PIX_MERCHANT_CITY
        value: SAO PAULO
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'
      - key: SENTRY_ENVIRONMENT
        value: production

  # AI Service (Python/FastAPI)
  - type: web
    name: evolua-ai
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    rootDir: ./apps/ai
    healthCheckPath: /healthz
    envVars:
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
