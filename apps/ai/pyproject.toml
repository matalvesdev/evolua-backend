[project]
name = "evolua-ai"
version = "1.0.0"
description = "Evolua AI service — RAG biblioteca, geração de evolução, materiais terapêuticos, assistente prontuário"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    "pypdf>=5.1.0",
    "sentry-sdk[fastapi]>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC"]
ignore = [
    "E501",     # Black/Ruff formatter does not split long strings or SQL literals.
    "ASYNC109", # Public client timeout parameters configure httpx request timeouts.
]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"] # FastAPI dependency/file declarations require call defaults.
"app/routers/clinical.py" = ["N815"] # CamelCase fields are an existing frontend JSON contract.

[tool.mypy]
python_version = "3.11"
strict = true
