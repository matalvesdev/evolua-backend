name: Deploy Prisma migrations to staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "STAGING" para aplicar migrations ou "RECOVER_STAGING" para reconciliar o timezone em staging'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-prisma-migrations-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: prisma migrate deploy (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Validate branch and confirmation
        run: |
          if [ "${GITHUB_REF_NAME}" != "develop" ]; then
            echo "::error::Migrations de staging só podem ser disparadas a partir de develop."
            exit 1
          fi
          if [ "${{ github.event.inputs.confirm }}" != "STAGING" ] && [ "${{ github.event.inputs.confirm }}" != "RECOVER_STAGING" ]; then
            echo "::error::Confirmação inválida. Digite exatamente 'STAGING' ou 'RECOVER_STAGING'."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reconcile only the known failed timezone migration
        if: ${{ github.event.inputs.confirm == 'RECOVER_STAGING' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: >-
          npx prisma migrate resolve --rolled-back
          20260817000200_add_clinic_timezone
          --schema=prisma/schema.prisma
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Confirm final status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma
